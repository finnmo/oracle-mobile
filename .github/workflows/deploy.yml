name: Deploy

# Manual only — do not auto-deploy on push (unsafe for a public / shared repo).
# Run from Actions → Deploy → Run workflow after reviewing the commit you want live.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Materialize production wrangler.toml
        env:
          WRANGLER_TOML: ${{ secrets.WRANGLER_TOML }}
        run: |
          if [ -z "$WRANGLER_TOML" ]; then
            echo "Missing GitHub secret WRANGLER_TOML (full production wrangler.toml contents)."
            exit 1
          fi
          printf '%s\n' "$WRANGLER_TOML" > wrangler.toml

      - name: Deploy to Cloudflare Workers
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
